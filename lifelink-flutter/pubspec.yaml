name: lifelink
description: LifeLink - Blood Donation and Blood Bank Management Mobile Application

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.0

  # UI
  flutter_screenutil: ^5.9.0
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0

  # Maps
  google_maps_flutter: ^2.5.3
  geolocator: ^10.1.0
  geocoding: ^2.1.1

  # Navigation
  go_router: ^13.0.0

  # Networking
  dio: ^5.4.0
  retrofit: ^4.1.0

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Authentication
  jwt_decoder: ^2.0.1

  # Notifications
  firebase_messaging: ^16.4.1
  flutter_local_notifications: ^16.3.2

  # Chat & Audio
  socket_io_client: ^2.0.3+1
  record: ^5.1.2
  audioplayers: ^5.2.1
  path_provider: ^2.1.2

  # Images
  cached_network_image: ^3.3.1
  image_picker: ^1.0.5

  # Utils
  intl: ^0.20.2
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  fluttertoast: ^8.2.4
  url_launcher: ^6.2.5

  # Charts
  fl_chart: ^0.66.2

  # Icons
  font_awesome_flutter: ^10.6.0

  # Permissions
  permission_handler: ^11.1.0

  # Localization
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9
  retrofit_generator: ^8.0.6
  json_serializable: ^6.7.1

dependency_overrides:
  record_platform_interface: 1.5.0
  record_linux: 1.3.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/translations/
